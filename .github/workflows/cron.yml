name: cron

on:
  schedule:
    - cron: "54 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refresh
        run: |
          set -eu
          sleep $(( RANDOM % 900 ))
          f="README.md"
          [ -f "$f" ] || exit 0
          stamp="<!-- generated: $(date -u +%Y-%m-%d) -->"
          if grep -q "^<!-- generated: " "$f"; then
            sed -i "s|^<!-- generated: .*|$stamp|" "$f"
          else
            printf '\n%s\n' "$stamp" >> "$f"
          fi

      - name: commit
        run: |
          set -eu
          git config user.name "john-clark-eng2000f3"
          git config user.email "279190863+john-clark-eng2000f3@users.noreply.github.com"
          set -- "docs: update generated marker" "chore: nightly tidy" "chore: scheduled refresh" "docs: touch up" "chore: periodic update"
          n=$(( ${GITHUB_RUN_NUMBER:-0} % $# + 1 ))
          eval msg=\${$n}
          git add -- "README.md"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$msg"
          git push
